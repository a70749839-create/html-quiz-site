<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اختبر معلوماتك | اختبار تفاعلي</title>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div id="question-container" class="hide">
       <div id="question">السؤال يظهر هنا</div>
        <div id="answer-buttons" class="btn-grid">
          <button class="btn">الاختيار الأول</button>
<button class="btn">الاختيار الثاني</button>
<button class="btn">الاختيار الثالث</button>
<button class="btn">الاختيار الرابع</button>
        </div>
      </div>
      <div id="total-score-container" class="hide">
      <p>النتيجة النهائية</p>
        <span id="total-score">5/10</span>
      </div>
      <div class="controls">
     <button id="start-btn" class="start-btn btn">ابدأ الاختبار</button>
        <button id="next-btn" class="next-btn btn hide">Next</button>
      </div>
    </div>
    <div id="score" class="hide">
      <span id="right-answers"></span>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
